<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Perch</title>
  <!-- Perch: a bird settled on a branch. Accent blue from the light theme (packages/ui tokens). -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#1d4fd7"/>
  <!-- branch -->
  <path d="M28 186 C 80 176, 176 176, 228 186" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- body -->
