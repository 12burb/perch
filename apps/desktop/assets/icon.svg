  <!-- head -->
  <circle cx="176" cy="92" r="30" fill="#ffffff"/>
  <!-- beak -->
  <path d="M203 88 L 232 96 L 203 106 Z" fill="#ffb84d"/>
  <!-- eye -->
  <circle cx="184" cy="86" r="5" fill="#1d4fd7"/>
