name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by on every commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check commits on this pull request
        run: bun scripts/check-dco.ts "origin/${{ github.base_ref }}..HEAD"
