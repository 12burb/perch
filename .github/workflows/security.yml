# Task 4.9: the scan that runs when nobody has pushed.
#
# CI scans every push, which catches a vulnerable dependency somebody *adds*. It does not catch the
# far more common case: a dependency that was fine on Monday and has an advisory on Thursday. This
# runs daily over the same targets — every lockfile in the repository, and the images the last
# release published — so a new advisory turns something red within a day instead of waiting for a
# push. CodeQL (codeql.yml) covers Perch's own code weekly; this covers what Perch depends on.
name: Security scan

on:
  schedule:
    - cron: "0 5 * * *" # daily, 05:00 UTC — an hour after CodeQL's weekly slot
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/security.yml"
      - ".trivyignore.yaml"

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies (every lockfile in the repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Fixed vulnerabilities only: an advisory with no fix is not something a bump can answer, and
      # a scan that cannot be made green is a scan people learn to ignore.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          trivyignores: .trivyignore.yaml

  images:
    name: The images main builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/Dockerfile.api
            target: ""
          # The agents layer: the base plus the four CLIs, without the Chromium download behind it.
          - name: runner
            dockerfile: deploy/Dockerfile.runner
            target: agents
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built from this commit rather than pulled from the registry: a published `:latest` is the
      # last release, and an advisory against it is not something a change to main can answer. What
      # this run adds over CI's own scan is a fresh vulnerability database against the same code —
      # which is exactly the advisory published after the merge.
      - name: Build
        run: |
          docker build -f ${{ matrix.dockerfile }} \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }} \
            -t perch-${{ matrix.name }}:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: perch-${{ matrix.name }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
