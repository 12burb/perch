name: CI

# Spec §8: install → Biome → typecheck → bun test (PGlite, and Postgres in a service container) →
# Playwright (compose smoke on Linux; laptop smoke on Linux, macOS, Windows) → axe → perf audit →
# Trivy on images. CodeQL runs weekly (codeql.yml); DCO on every pull request (dco.yml).
on:
  pull_request:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.62.1

jobs:
  check:
    name: Biome, typecheck, unit tests, SDK drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: perch
          POSTGRES_PASSWORD: perch
          POSTGRES_DB: perch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perch -d perch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The DCO test in scripts/ checks the whole history, not the one commit a depth-1 clone sees.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The fs.search acceptance benchmark (task 1.5) runs on ripgrep, the runner image's engine.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bun run lint
      - run: bun run typecheck
      - name: Unit tests (PGlite in memory and the Postgres service)
        run: bun run test
        env:
          PERCH_TEST_DATABASE_URL: postgres://perch:perch@localhost:5432/perch_test
      - name: SDK drift (openapi.json and the generated client are committed)
        run: bun run sdk:generate && git diff --exit-code -- packages/api-client

  e2e:
    name: Playwright, component tests, axe, perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run --filter @perch/web build
      - name: The runner's browser — a picture, the console, the failed requests (task 3.21)
        # It lives here rather than with the unit tests because it needs a real browser, and this
        # is the job that has one: the runner finds what `playwright install` put in the cache
        # above. `bun test` skips it where there is none, so the job says there must be one.
        run: bun test apps/runner/test/screenshot.test.ts
        env:
          PERCH_REQUIRE_BROWSER: "1"
      - name: Perf budgets (bundle, WS envelope, long lists)
        run: bun run perf
      - name: Component tests with axe (packages/ui)
        run: bun run ct
      - name: End-to-end from the setup wizard (axe on every page)
        run: bun run e2e
        env:
          CI: "1"
          E2E_SETUP: wizard
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            packages/ui/playwright-report
            packages/ui/test-results
          retention-days: 7

  laptop-smoke:
    name: Laptop smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: ripgrep (the fs.search benchmark's engine; Windows runs the built-in engine)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: ripgrep
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: bun run --filter @perch/web build
      - name: perch dev, doctor, backup, restore, and the compiled binary
        run: bun test apps/cli apps/runner
      - name: Desktop prerequisites (WebKitGTK, libxdo, xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libxdo3 xvfb
      - name: Desktop prerequisites (the WebView2 runtime, when the image lacks it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $installed = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if ($installed) { Write-Host "WebView2 runtime $installed present"; exit 0 }
          Write-Host "installing the WebView2 runtime (Evergreen bootstrapper)"
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          Start-Process -FilePath "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent','/install' -Wait
          (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
      - name: The desktop app (a native window on laptop mode)
        shell: bash
        env:
          PERCH_DESKTOP_NATIVE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a bun test apps/desktop; else bun test apps/desktop; fi
      - name: Build the desktop app; --check and --smoke from the binary
        shell: bash
        run: |
          bun scripts/build-desktop.ts --out dist/desktop --version 0.0.0-ci
          bin="dist/desktop/$(cat dist/desktop/BINARY)"
          "$bin" --check
          # A watchdog: a stalled webview must fail the step in minutes, not at the job timeout.
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$bin" --smoke & else "$bin" --smoke & fi
          pid=$!
          for i in $(seq 1 150); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then echo "::error::perch-desktop --smoke stalled for 150 s"; kill "$pid"; exit 1; fi
          wait "$pid"
          ls -la dist/desktop

  docs-site:
    name: The docs site (task 4.7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Every page, every link between them, and the sidebar that has to hold all of them.
      - name: Pages and links
        run: bun scripts/docs-site.ts
      - name: Build the site (Astro Starlight, with its Pagefind search index)
        working-directory: docs/site
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/site/dist

  runner-agents:
    name: The agent CLIs in the runner image (task 4.6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Just the `agents` stage: the four CLIs and the two ACP bridges at the versions
      # deploy/agents.json pins, without the Chromium download and the Hermes checkout behind it.
      - name: Build the agents layer
        run: docker build -f deploy/Dockerfile.runner --target agents -t perch-runner-agents:ci .
      - name: The four report their versions, and the manifest says the same
        run: |
          set -euo pipefail
          # -c, not -lc: a login shell would source /etc/profile and drop /opt/node/bin from PATH.
          docker run --rm --entrypoint bash perch-runner-agents:ci -c '
            set -euo pipefail
            for id in $(jq -r ".agents | keys[]" /opt/perch/agents.json); do
              command=$(jq -r ".agents.\"$id\".command" /opt/perch/agents.json)
              pinned=$(jq -r ".agents.\"$id\".version" /opt/perch/agents.json)
              reported=$("$command" --version 2>&1 | head -n 1)
              echo "$id: pinned $pinned, reports $reported"
              case "$reported" in *"$pinned"*) ;; *) echo "::error::$command does not report $pinned"; exit 1 ;; esac
            done
            for bridge in codex-acp claude-agent-acp; do command -v "$bridge"; done
          '
      # The runner image is scanned too (task 4.9): it is the one that runs other people's code,
      # and until now only the api image was looked at.
      - name: Trivy (the runner image's agents layer)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: perch-runner-agents:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

  reliability:
    name: The reliability bar (task 4.10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The published bar, not the smaller one `bun run check` affords: a hundred sessions at once,
      # an upgrade with no data loss, and a runner killed mid-turn (docs/reliability.md).
      - name: A hundred sessions, an upgrade, a runner killed mid-turn
        run: bun run reliability

  compose-smoke:
    name: Compose smoke (docker compose up → wizard → sign in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@v4
      - name: Build the api and caddy images
        run: |
          docker build -f deploy/Dockerfile.api -t ghcr.io/12burb/perch-api:ci --build-arg PERCH_VERSION=ci --build-arg PERCH_COMMIT=${{ github.sha }} .
          docker build -f deploy/Dockerfile.caddy -t ghcr.io/12burb/perch-caddy:ci deploy
      - run: bun install --frozen-lockfile
      - name: perch init
        run: bun apps/cli/src/index.ts init --yes --dir /tmp/perch --public-url http://localhost --image-tag ci
      - name: docker compose up
        working-directory: /tmp/perch
        run: |
          docker compose up -d caddy api postgres
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/health >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://localhost/api/health
      - name: The setup wizard, then sign in
        run: bun scripts/compose-smoke.ts http://localhost
      - name: The restore drill (task 4.4) — back this instance up, restore it into an empty database
        working-directory: /tmp/perch
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          password=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)
          id=$(docker compose exec -T api bun apps/api/src/index.ts backup | sed -n 's/^backup \([^ ]*\) written.*/\1/p')
          test -n "$id"
          docker compose exec -T postgres psql -U perch -d perch -c "create database perch_restore"
          docker compose exec -T \
            -e DATABASE_URL="postgres://perch:$password@postgres:5432/perch_restore" \
            api bun apps/api/src/index.ts restore "/data/backups/$id"
          workspaces=$(docker compose exec -T postgres psql -U perch -d perch_restore -tAc "select count(*) from workspaces")
          users=$(docker compose exec -T postgres psql -U perch -d perch_restore -tAc "select count(*) from users")
          echo "restored $workspaces workspaces and $users users into an empty database"
          test "$(echo "$workspaces" | tr -d '[:space:]')" -ge 1
          test "$(echo "$users" | tr -d '[:space:]')" -ge 1
      - name: Logs and teardown
        if: always()
        run: |
          # perch init has not run when an earlier step failed.
          if [ -f /tmp/perch/docker-compose.yml ]; then
            cd /tmp/perch
            docker compose logs --no-color api caddy | tail -n 200
            docker compose down -v
          fi
      - name: Trivy (api image and the repository)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/12burb/perch-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
