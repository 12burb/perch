name: Changesets

# Spec §8: changesets produce the changelog. Run by hand, this opens (or refreshes) a "Version Packages"
# pull request that bumps versions and CHANGELOGs from the pending changesets. The maintainer's sessions
# version directly instead (`bun run version`, commit, then the Release workflow; ADR-0065), and opening a
# pull request from Actions needs the repository setting "Allow GitHub Actions to create and approve pull
# requests", so this is not on every push.
on:
  workflow_dispatch:

concurrency: changesets-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version-script: bun run version
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
