# Clerk (spec §3.5, §5.5; task 2.14).
#
# Clerk's MCP server takes a client metadata document (CIMD, in beta) and registers clients on the
# spot; a secret key is the fallback. Clerk can also be Perch's own login, through better-auth's
# generic OIDC — that is a different thing from this connector, which is Perch calling Clerk.
id: clerk
name: Clerk
summary: Read users and organizations, and look up a session.
docs_url: https://clerk.com/docs/mcp/build-mcp-server
auth:
  - mcp_oauth
  - token
api_base: https://api.clerk.com
token_prefix:
  - sk_test_
  - sk_live_
test_path: /v1/users?limit=1
mcp_url: https://mcp.clerk.com/mcp
webhook_signature: hmac_sha256
