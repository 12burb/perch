# Discord (spec §5.5 seed list; task 3.11).
#
# A bot token is pasted, and goes on the wire as `Bot <token>` rather than `Bearer` — which is why
# this connector is REST-only for now and not wired to the gateway.
#
# Discord signs what it sends with Ed25519 over `<timestamp><body>`, and the key is its own: an
# endpoint for Discord is made by pasting the application's public key into Perch rather than
# pasting a Perch secret into Discord (task 3.25). The timestamp is signed too, so a delivery that
# is replayed later than the tolerance is refused.
id: discord
name: Discord
summary: Post to a Discord channel and read a guild's channels.
docs_url: https://discord.com/developers/docs/reference
auth:
  - oauth2
  - token
api_base: https://discord.com/api/v10
test_path: /users/@me
account_field: username
oauth:
  authorize_url: https://discord.com/oauth2/authorize
  token_url: https://discord.com/api/oauth2/token
  scopes:
    - bot
    - identify
  scope_separator: " "
  refresh: true
webhook_signature: ed25519
webhook:
  header: x-signature-ed25519
  encoding: hex
  signed: "{timestamp}{body}"
  timestamp_header: x-signature-timestamp
