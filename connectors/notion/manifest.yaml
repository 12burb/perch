# Notion (spec §5.5 seed list; task 3.11).
#
# Notion refuses any request without a `Notion-Version`, which is why a manifest can carry headers
# of its own. An internal integration's token is pasted; a public one comes through OAuth. Notion's
# webhooks are verified with a token you copy once when the subscription is created, which is not
# the HMAC shape this schema describes, so deliveries here are unsigned.
id: notion
name: Notion
summary: Read and write pages and databases in a Notion workspace.
docs_url: https://developers.notion.com/reference/intro
auth:
  - oauth2
  - token
api_base: https://api.notion.com
token_prefix:
  - ntn_
  - secret_
test_path: /v1/users/me
account_field: name
headers:
  Notion-Version: "2022-06-28"
oauth:
  authorize_url: https://api.notion.com/v1/oauth/authorize
  token_url: https://api.notion.com/v1/oauth/token
  scopes: []
  scope_separator: " "
  refresh: false
webhook_signature: none
