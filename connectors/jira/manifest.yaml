# Jira (spec §5.5 seed list; task 3.25).
#
# Atlassian's 3LO flow needs `audience=api.atlassian.com` on the authorize URL — without it the
# token comes back for nothing in particular — and `offline_access` is the scope that earns a
# refresh token. The API lives behind api.atlassian.com per site, so `/me` is the call that proves
# a token works before anybody has picked a site.
#
# The paste lane here wants an OAuth access token. An Atlassian API token is used with Basic auth
# and an email address, which is a second field this schema does not have; use the Sign in lane.
#
# Only webhooks registered through the REST API with a secret are signed, and those are signed
# WebSub style: `X-Hub-Signature: sha256=<hex>` over the raw body.
id: jira
name: Jira
summary: Read and create issues, and hear about them when they change.
docs_url: https://developer.atlassian.com/cloud/jira/platform/oauth-2-3lo-apps/
auth:
  - oauth2
  - token
api_base: https://api.atlassian.com
test_path: /me
account_field: email
oauth:
  authorize_url: https://auth.atlassian.com/authorize
  token_url: https://auth.atlassian.com/oauth/token
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - offline_access
  scope_separator: " "
  refresh: true
  authorize_params:
    audience: api.atlassian.com
    prompt: consent
webhook_signature: hmac_sha256
webhook:
  header: x-hub-signature
  prefix: "sha256="
  encoding: hex
  signed: "{body}"
